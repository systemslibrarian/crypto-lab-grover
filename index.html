<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const saved = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', saved ?? 'dark');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive Grover's quantum search algorithm simulator — visualize amplitude amplification and its impact on AES and SHA symmetric cryptography." />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:title" content="Grover's Algorithm Lab" />
    <meta property="og:description" content="See why AES-256 retains strong post-quantum security margins while AES-128 is weakened under idealized Grover assumptions. Interactive amplitude amplification simulator." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />
    <title>Grover's Algorithm Lab — Quantum Search Simulator</title>
    <style>
/* ── Standardized Crypto Lab header ───────────────────── */
.cl-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 20px;
  background: #0e1f1e;
  position: relative;
  overflow: hidden;
}

.cl-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(77, 207, 176, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77, 207, 176, 0.05) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}

.cl-header-left {
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 1;
}

.cl-badge {
  width: 36px;
  height: 36px;
  background: #162b2a;
  border: 1px solid #2a4a44;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: monospace;
  font-size: 13px;
  font-weight: 700;
  color: #4dcfb0;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.cl-header-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.cl-title {
  font-size: 16px;
  font-weight: 700;
  color: #e8f5f2;
  letter-spacing: 1.5px;
  line-height: 1.2;
}

.cl-sub {
  font-size: 11px;
  color: #4dcfb0;
  letter-spacing: 1px;
  font-family: monospace;
  opacity: 0.8;
  text-decoration: none;
}

.cl-sub:hover {
  opacity: 1;
  text-decoration: underline;
}

.cl-header-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
  z-index: 1;
}

.cl-nav-btn {
  padding: 6px 14px;
  font-size: 11px;
  font-family: monospace;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #4dcfb0;
  background: #162b2a;
  border: 1px solid #2a4a44;
  border-radius: 6px;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.cl-nav-btn:hover {
  background: #1e3c3a;
  border-color: #4dcfb0;
}

.cl-theme-toggle {
  width: 36px;
  height: 36px;
  background: #162b2a;
  border: 1px solid #2a4a44;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  color: #4dcfb0;
  transition: background 0.15s, border-color 0.15s;
  line-height: 1;
}

.cl-theme-toggle:hover {
  background: #1e3c3a;
  border-color: #4dcfb0;
}
/* ────────────────────────────────────────────────────── */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
